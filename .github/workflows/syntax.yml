name: syntax check (compileall, no tests)

# This repo has no test suite. This workflow only byte-compiles every module,
# so it catches syntax errors and nothing else. It does NOT prove the model or
# the training loop is correct, and it does NOT install torch — installing the
# runtime dependencies would add minutes to every push without testing anything.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Compile every module (syntax only)
        run: |
          echo "compileall checks syntax; it does not import torch and does not run anything."
          python -m compileall -q .
          echo "all modules compiled"
